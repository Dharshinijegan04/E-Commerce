<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | LuxeBoutique</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: light + modern -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== LIGHT & ATTRACTIVE DESIGN TOKENS ========== */
    :root {
      --lavender-mist: #f3eefc;
      --lavender-soft: #e6dcf7;
      --lilac: #b39ddb;
      --violet-deep: #7c4dff;
      --violet-vibrant: #9c6eff;
      --peach-soft: #ffe8e0;
      --peach-warm: #ffb4a2;
      --coral: #ff7b6b;
      --mint-mist: #e3f7f2;
      --mint: #6bd6c0;
      --teal-deep: #0fa890;
      --sky-mist: #e8f4fd;
      --sky: #5aa9e6;
      --cream: #fffdfa;
      --white: #ffffff;
      --charcoal: #2d2640;
      --gray-soft: #8b8399;
      --error-soft: #e05a4f;

      --gradient-hero: linear-gradient(135deg, #f3eefc 0%, #e8f4fd 50%, #ffe8e0 100%);
      --gradient-btn: linear-gradient(135deg, #9c6eff 0%, #ff7b6b 100%);
      --gradient-btn-hover: linear-gradient(135deg, #7c4dff 0%, #ff5c47 100%);
      --gradient-gold: linear-gradient(135deg, #ffd966 0%, #ffb347 100%);
      --shadow-soft: 0 20px 50px -12px rgba(124, 77, 255, 0.15);
      --shadow-card: 0 30px 70px -20px rgba(124, 77, 255, 0.22);
      --shadow-input: 0 2px 10px rgba(124, 77, 255, 0.06);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* ========== BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--gradient-hero);
      color: var(--charcoal);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* ========== DECORATIVE BACKGROUND BLOBS ========== */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
      animation: floatBlob 12s ease-in-out infinite;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      top: -180px;
      right: -120px;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      bottom: -160px;
      left: -100px;
      animation-delay: -6s;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }

    /* ========== NAVBAR – clean & light ========== */
    .navbar {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0.9rem 0;
      box-shadow: 0 4px 24px rgba(124, 77, 255, 0.06);
      border-bottom: 1px solid rgba(179, 157, 219, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      animation: slideDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-100%); }
      to { opacity: 1; transform: translateY(0); }
    }

    .navbar-brand {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      color: var(--charcoal) !important;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      transition: var(--transition);
    }

    .navbar-brand:hover {
      transform: scale(1.03);
    }

    .navbar-brand i {
      background: var(--gradient-btn);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 1.9rem;
      animation: crownGlow 3s ease-in-out infinite;
    }

    @keyframes crownGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(156, 110, 255, 0)); }
      50% { filter: drop-shadow(0 0 12px rgba(156, 110, 255, 0.6)); }
    }

    .navbar .nav-link {
      color: var(--charcoal) !important;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.1px;
      margin: 0 0.4rem;
      padding: 0.4rem 0;
      position: relative;
      transition: var(--transition);
      white-space: nowrap;
    }

    .navbar .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--gradient-btn);
      border-radius: 2px;
      transition: width 0.35s ease;
    }

    .navbar .nav-link:hover,
    .navbar .nav-link.active {
      color: var(--violet-deep) !important;
    }

    .navbar .nav-link:hover::after,
    .navbar .nav-link.active::after {
      width: 100%;
    }

    .user-name {
      color: var(--charcoal);
      font-weight: 600;
      font-size: 0.95rem;
      margin-right: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 1rem;
      background: linear-gradient(135deg, var(--lavender-mist), var(--peach-soft));
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .user-name i {
      color: var(--violet-deep);
    }

    .logout-btn {
      background: var(--gradient-btn);
      background-size: 200% 200%;
      border: none;
      color: var(--white);
      border-radius: var(--radius-pill);
      padding: 0.55rem 1.3rem;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
      box-shadow: 0 8px 22px -6px rgba(156, 110, 255, 0.4);
      animation: gradientShift 5s ease infinite;
      text-decoration: none;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .logout-btn:hover {
      background: var(--gradient-btn-hover);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px -8px rgba(156, 110, 255, 0.55);
      color: var(--white);
    }

    /* ========== CHECKOUT SECTION ========== */
    .checkout-section {
      padding: 3.5rem 0 5rem;
      position: relative;
      z-index: 1;
    }

    /* ========== PAGE TITLE ========== */
    .page-title {
      font-family: 'Fraunces', serif;
      color: var(--charcoal);
      font-size: 2.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.8rem;
      letter-spacing: -0.03em;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.2s;
    }

    .page-title span {
      background: var(--gradient-btn);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-style: italic;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      margin: 1.2rem auto 2.5rem;
      background: linear-gradient(90deg, transparent, var(--coral), transparent);
      border-radius: 4px;
      animation: lineExpand 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.3s;
    }

    @keyframes lineExpand {
      from { width: 0; opacity: 0; }
      to { width: 100px; opacity: 1; }
    }

    /* ========== CHECKOUT CARDS ========== */
    .checkout-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2.2rem;
      height: 100%;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
      transition: var(--transition);
      animation: cardEntrance 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .checkout-card:nth-child(1) { animation-delay: 0.35s; }
    .checkout-card:nth-child(2) { animation-delay: 0.5s; }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(50px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .checkout-card:hover {
      box-shadow: 0 40px 90px -24px rgba(124, 77, 255, 0.28);
    }

    /* decorative corner accent */
    .checkout-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(179, 157, 219, 0.2) 0%, transparent 70%);
      transition: var(--transition);
      pointer-events: none;
    }

    .checkout-card:hover::before {
      transform: scale(1.4);
    }

    /* ========== CARD TITLE ========== */
    .card-title {
      font-family: 'Fraunces', serif;
      color: var(--charcoal);
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      position: relative;
      z-index: 1;
      letter-spacing: -0.01em;
    }

    .card-title .title-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--lavender-mist), var(--peach-soft));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: var(--violet-deep);
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: 0 8px 22px -8px rgba(124, 77, 255, 0.25);
    }

    .checkout-card:hover .card-title .title-icon {
      background: var(--gradient-btn);
      color: var(--white);
      transform: rotate(-8deg) scale(1.05);
    }

    /* ========== FORM ========== */
    .form-label {
      color: var(--charcoal);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      display: block;
    }

    .form-control,
    .form-select {
      border: 2px solid transparent;
      background: var(--lavender-mist);
      border-radius: var(--radius-lg);
      padding: 0.85rem 1.1rem;
      font-size: 0.95rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--charcoal);
      transition: var(--transition);
      box-shadow: var(--shadow-input);
      width: 100%;
    }

    .form-control::placeholder {
      color: #a9a2b8;
      font-weight: 400;
    }

    .form-control:focus,
    .form-select:focus {
      background: var(--white);
      border-color: var(--violet-vibrant);
      box-shadow: 0 0 0 5px rgba(156, 110, 255, 0.12), var(--shadow-input);
      outline: none;
      transform: translateY(-2px);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 90px;
    }

    /* ========== ORDER SUMMARY ========== */
    .order-summary {
      background: linear-gradient(135deg, var(--lavender-mist) 0%, var(--peach-soft) 100%);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.6rem;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      z-index: 1;
    }

    .order-summary::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
      animation: circleFloat 9s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes circleFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(15px, -20px) scale(1.15); }
    }

    .order-item {
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(179, 157, 219, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .order-item:nth-child(1) { animation-delay: 0.6s; }
    .order-item:nth-child(2) { animation-delay: 0.7s; }
    .order-item:nth-child(3) { animation-delay: 0.8s; }
    .order-item:nth-child(4) { animation-delay: 0.9s; }
    .order-item:nth-child(5) { animation-delay: 1s; }

    .order-item:last-of-type {
      border-bottom: none;
    }

    .product-name {
      color: var(--charcoal);
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .order-item:hover .product-name {
      color: var(--violet-deep);
    }

    .product-price {
      font-family: 'Fraunces', serif;
      color: var(--violet-deep);
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* ========== TOTAL BOX ========== */
    .total-box {
      margin-top: 1.3rem;
      padding-top: 1.3rem;
      border-top: 2px dashed rgba(179, 157, 219, 0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 1s;
    }

    .total-label {
      font-family: 'Fraunces', serif;
      color: var(--charcoal);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .total-amount {
      font-family: 'Fraunces', serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--gradient-btn);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    /* ========== BUTTONS ========== */
    .payment-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      text-align: center;
      background: var(--gradient-gold);
      background-size: 200% 200%;
      color: #5a4600;
      border: none;
      padding: 1rem 1.8rem;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.3px;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 12px 30px -8px rgba(255, 179, 71, 0.5);
      animation: gradientShift 5s ease infinite;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .payment-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transition: left 0.6s ease;
    }

    .payment-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 0 0 rgba(255, 179, 71, 0.6);
      animation: pulseGold 2.5s ease-out infinite;
    }

    @keyframes pulseGold {
      0% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(255, 179, 71, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0); }
    }

    .payment-btn:hover {
      color: #3d2f00;
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(255, 179, 71, 0.6);
    }

    .payment-btn:hover::before {
      left: 100%;
    }

    .payment-btn i {
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .payment-btn:hover i {
      transform: translateX(4px);
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      text-align: center;
      background: var(--white);
      color: var(--charcoal);
      border: 2px solid var(--lavender-soft);
      padding: 0.9rem 1.8rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .back-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(156, 110, 255, 0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }

    .back-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .back-btn:hover {
      border-color: var(--violet-vibrant);
      color: var(--violet-deep);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -10px rgba(156, 110, 255, 0.3);
    }

    .back-btn i {
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .back-btn:hover i {
      transform: translateX(-4px);
    }

    /* ========== FOOTER ========== */
    footer {
      background: var(--charcoal);
      color: rgba(255, 255, 255, 0.85);
      padding: 2.5rem 0;
      text-align: center;
      position: relative;
      z-index: 1;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
    }

    footer p {
      margin-bottom: 1rem;
    }

    footer i.heart {
      color: var(--coral);
      animation: heartBeat 1.5s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.15); }
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
    }

    .social-icons a {
      color: var(--charcoal);
      background: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: var(--transition);
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    .social-icons a:hover {
      background: var(--gradient-btn);
      color: var(--white);
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 12px 24px -8px rgba(156, 110, 255, 0.5);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 991px) {
      .checkout-section {
        padding: 2.5rem 0 4rem;
      }

      .checkout-card {
        padding: 2rem 1.8rem;
      }

      .page-title {
        font-size: 2.3rem;
      }

      .checkout-card:nth-child(1),
      .checkout-card:nth-child(2) {
        animation-delay: 0.3s;
      }
    }

    @media (max-width: 768px) {
      .navbar-brand {
        font-size: 1.5rem;
      }

      .navbar-brand i {
        font-size: 1.5rem;
      }

      .checkout-section {
        padding: 2rem 0.8rem 3rem;
      }

      .checkout-card {
        padding: 1.6rem 1.2rem;
        border-radius: var(--radius-lg);
      }

      .page-title {
        font-size: 1.9rem;
      }

      .card-title {
        font-size: 1.35rem;
      }

      .card-title .title-icon {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }

      .form-control,
      .form-select {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }

      .total-amount {
        font-size: 1.6rem;
      }

      .payment-btn,
      .back-btn {
        padding: 0.85rem 1.5rem;
        font-size: 0.92rem;
      }

      .user-name {
        margin: 0.5rem 0;
        justify-content: center;
      }

      body::before,
      body::after {
        filter: blur(60px);
        opacity: 0.35;
      }
    }

    @media (max-width: 400px) {
      .page-title {
        font-size: 1.6rem;
      }

      .card-title {
        font-size: 1.2rem;
      }
    }

    /* ========== REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== ACCESSIBILITY ========== */
    .payment-btn:focus-visible,
    .back-btn:focus-visible,
    .logout-btn:focus-visible,
    .social-icons a:focus-visible {
      outline: 3px solid var(--violet-vibrant);
      outline-offset: 3px;
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--lavender-mist); }
    ::-webkit-scrollbar-thumb {
      background: var(--lilac);
      border-radius: 10px;
      border: 2px solid var(--lavender-mist);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet-vibrant); }
  </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->

<!-- ================= CHECKOUT ================= -->
<section class="checkout-section">
  <div class="container">

    <h1 class="page-title">
      Secure <span>Checkout</span>
    </h1>

    <div class="row g-4">

      <!-- ================= BILLING DETAILS ================= -->
      <div class="col-lg-6">
        <div class="checkout-card">

          <h2 class="card-title">
            <span class="title-icon">
              <i class="fas fa-map-marker-alt"></i>
            </span>
            Billing Details
          </h2>

          <form>

            <!-- Name -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Enter your full name"
                required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input
                type="tel"
                name="phone"
                class="form-control"
                placeholder="Enter your phone number"
                required>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea
                name="address"
                class="form-control"
                rows="3"
                placeholder="Enter your complete address"
                required></textarea>
            </div>

            <div class="row">

              <!-- City -->
              <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <input
                  type="text"
                  name="city"
                  class="form-control"
                  placeholder="Enter city"
                  required>
              </div>

              <!-- State -->
              <div class="col-md-6 mb-3">
                <label class="form-label">State</label>
                <input
                  type="text"
                  name="state"
                  class="form-control"
                  placeholder="Enter state"
                  required>
              </div>

            </div>

            <!-- Zip -->
            <div class="mb-3">
              <label class="form-label">ZIP / Postal Code</label>
              <input
                type="text"
                name="zipCode"
                class="form-control"
                placeholder="Enter ZIP code"
                required>
            </div>

          </form>

        </div>
      </div>

      <!-- ================= ORDER SUMMARY ================= -->
      <div class="col-lg-6">
        <div class="checkout-card">

          <h2 class="card-title">
            <span class="title-icon">
              <i class="fas fa-shopping-bag"></i>
            </span>
            Order Summary
          </h2>

          <div class="order-summary">

            <!-- Products -->
            <div
              class="order-item"
              th:each="product : ${cartProducts}">

              <div class="product-name" th:text="${product.name}">
                Product Name
              </div>

              <div class="product-price" th:text="${'₹' + product.price}">
                ₹0
              </div>

            </div>

            <!-- Total -->
            <div class="total-box">
              <span class="total-label">
                <i class="fas fa-receipt me-2"></i>Total Amount
              </span>

              <span class="total-amount" th:text="${'₹' + totalAmount}">
                ₹0
              </span>
            </div>

          </div>

          <!-- Payment -->
          <div class="mt-4">
            <a
              th:href="@{/payment?totalAmount={totalAmount}(totalAmount=${totalAmount})}"
              class="payment-btn">
              <i class="fas fa-lock"></i>
              Proceed to Payment
            </a>
          </div>

          <!-- Back -->
          <div class="mt-3">
            <a th:href="@{/cart}" class="back-btn">
              <i class="fas fa-arrow-left"></i>
              Back to Cart
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
