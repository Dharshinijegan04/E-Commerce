<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | LuxeBoutique</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: light + modern -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== LIGHT & ATTRACTIVE DESIGN TOKENS ========== */
    :root {
      --lavender-mist: #f3eefc;
      --lavender-soft: #e6dcf7;
      --lilac: #b39ddb;
      --violet-deep: #7c4dff;
      --violet-vibrant: #9c6eff;
      --peach-soft: #ffe8e0;
      --peach-warm: #ffb4a2;
      --coral: #ff7b6b;
      --mint-mist: #e3f7f2;
      --mint: #6bd6c0;
      --teal-deep: #0fa890;
      --sky-mist: #e8f4fd;
      --sky: #5aa9e6;
      --cream: #fffdfa;
      --white: #ffffff;
      --charcoal: #2d2640;
      --gray-soft: #8b8399;
      --success-green: #28a745;
      --success-soft: #d4f5e9;
      --success-deep: #0b6e4f;

      --gradient-hero: linear-gradient(135deg, #f3eefc 0%, #e8f4fd 50%, #ffe8e0 100%);
      --gradient-btn: linear-gradient(135deg, #9c6eff 0%, #ff7b6b 100%);
      --gradient-btn-hover: linear-gradient(135deg, #7c4dff 0%, #ff5c47 100%);
      --gradient-gold: linear-gradient(135deg, #ffd966 0%, #ffb347 100%);
      --gradient-success: linear-gradient(135deg, #6bd6c0 0%, #28a745 100%);
      --shadow-soft: 0 20px 50px -12px rgba(124, 77, 255, 0.15);
      --shadow-card: 0 30px 70px -20px rgba(124, 77, 255, 0.22);
      --shadow-input: 0 2px 10px rgba(124, 77, 255, 0.06);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* ========== BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--gradient-hero);
      color: var(--charcoal);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ========== DECORATIVE BACKGROUND BLOBS ========== */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
      animation: floatBlob 12s ease-in-out infinite;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      top: -180px;
      right: -120px;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      bottom: -160px;
      left: -100px;
      animation-delay: -6s;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }

    /* ========== CONFIRMATION CONTAINER ========== */
    .confirmation-container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-xl);
      padding: 3.5rem 3rem;
      max-width: 720px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-card);
      z-index: 1;
      animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.15s;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(50px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .confirmation-container:hover {
      box-shadow: 0 40px 90px -24px rgba(124, 77, 255, 0.28);
    }

    /* top gradient accent bar */
    .confirmation-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--violet-vibrant), var(--coral), var(--mint));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      animation: gradientShift 4s ease infinite;
      background-size: 200% 200%;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* decorative floating circles */
    .floating-decoration {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.5;
    }

    .decoration-1 {
      top: -70px;
      right: -70px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      filter: blur(30px);
      animation: circleFloat 10s ease-in-out infinite;
    }

    .decoration-2 {
      bottom: -80px;
      left: -80px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #6bd6c0 0%, transparent 70%);
      filter: blur(30px);
      animation: circleFloat 12s ease-in-out infinite reverse;
    }

    .decoration-3 {
      top: 40%;
      left: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      filter: blur(25px);
      animation: circleFloat 14s ease-in-out infinite;
      animation-delay: -4s;
    }

    @keyframes circleFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -25px) scale(1.15); }
    }

    /* ========== SUCCESS ICON ========== */
    .confirmation-icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 2;
      animation: badgePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.4s;
    }

    @keyframes badgePop {
      0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      70% { transform: scale(1.1) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .confirmation-icon {
      width: 110px;
      height: 110px;
      border-radius: 32px;
      background: linear-gradient(135deg, var(--mint-mist), var(--success-soft));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--success-deep);
      box-shadow: 0 20px 50px -14px rgba(40, 167, 69, 0.35);
      transition: var(--transition);
      position: relative;
    }

    .confirmation-icon::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 36px;
      border: 2px solid rgba(40, 167, 69, 0.2);
      animation: iconPulse 2.5s ease-out infinite;
    }

    @keyframes iconPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .confirmation-icon:hover {
      transform: translateY(-6px) rotate(-6deg) scale(1.05);
      background: var(--gradient-success);
      color: var(--white);
      box-shadow: 0 28px 60px -16px rgba(40, 167, 69, 0.5);
    }

    .confirmation-icon i {
      animation: checkBounce 1.2s ease-in-out infinite;
    }

    @keyframes checkBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
    }

    /* ========== TITLE ========== */
    .confirmation-title {
      position: relative;
      z-index: 2;
      font-family: 'Fraunces', serif;
      color: var(--charcoal);
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.8rem;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.5s;
    }

    .confirmation-title span {
      background: var(--gradient-success);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-style: italic;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confirmation-title::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      margin: 1.2rem auto 0;
      background: linear-gradient(90deg, transparent, var(--mint), transparent);
      border-radius: 4px;
      animation: lineExpand 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.6s;
    }

    @keyframes lineExpand {
      from { width: 0; opacity: 0; }
      to { width: 100px; opacity: 1; }
    }

    /* ========== MESSAGE ========== */
    .confirmation-message {
      position: relative;
      z-index: 2;
      color: var(--gray-soft);
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 1.8rem auto 2rem;
      max-width: 520px;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.7s;
    }

    /* ========== ORDER DETAILS ========== */
    .order-details {
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, var(--lavender-mist) 0%, var(--peach-soft) 100%);
      border-radius: var(--radius-lg);
      padding: 1.8rem 1.8rem;
      margin: 2rem 0;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 40px -16px rgba(124, 77, 255, 0.2);
      overflow: hidden;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.8s;
    }

    .order-details::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
      animation: circleFloat 9s ease-in-out infinite;
      pointer-events: none;
    }

    .order-details h5 {
      color: var(--charcoal);
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px dashed rgba(179, 157, 219, 0.35);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .order-details h5 i {
      color: var(--violet-deep);
    }

    .order-details p {
      margin-bottom: 0.9rem;
      color: #5a5268;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .order-details p:nth-of-type(1) { animation-delay: 0.9s; }
    .order-details p:nth-of-type(2) { animation-delay: 1s; }
    .order-details p:nth-of-type(3) { animation-delay: 1.1s; }

    .order-details p:last-child {
      margin-bottom: 0;
    }

    .order-details p i {
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .order-details p i.success-icon {
      color: var(--success-green);
    }

    .order-details p i.info-icon {
      color: var(--violet-deep);
    }

    /* ========== BUTTONS ========== */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      margin-top: 1.5rem;
      position: relative;
      z-index: 2;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 1.2s;
    }

    .btn-continue {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--gradient-btn);
      background-size: 200% 200%;
      color: var(--white);
      padding: 1rem 2.2rem;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.3px;
      transition: var(--transition);
      box-shadow: 0 12px 30px -8px rgba(156, 110, 255, 0.5);
      animation: gradientShift 5s ease infinite;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn-continue::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: left 0.6s ease;
    }

    .btn-continue::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 0 0 rgba(156, 110, 255, 0.7);
      animation: pulseRing 2.5s ease-out infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(156, 110, 255, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(156, 110, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(156, 110, 255, 0); }
    }

    .btn-continue:hover {
      background: var(--gradient-btn-hover);
      color: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(156, 110, 255, 0.6);
    }

    .btn-continue:hover::before {
      left: 100%;
    }

    .btn-continue i {
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .btn-continue:hover i {
      transform: translateX(4px) scale(1.1);
    }

    .btn-orders {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--white);
      color: var(--charcoal);
      border: 2px solid var(--lavender-soft);
      padding: 0.95rem 2.2rem;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn-orders::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(156, 110, 255, 0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }

    .btn-orders:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-orders:hover {
      border-color: var(--violet-vibrant);
      color: var(--violet-deep);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -10px rgba(156, 110, 255, 0.3);
    }

    .btn-orders i {
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .btn-orders:hover i {
      transform: translateX(-4px);
    }

    /* ========== CONFETTI ========== */
    .confetti {
      position: absolute;
      width: 10px;
      height: 14px;
      opacity: 0;
      z-index: 5;
      border-radius: 2px;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(-20px) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(850px) rotate(720deg);
      }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      body {
        padding: 1.5rem 0.8rem;
      }

      .confirmation-container {
        padding: 2.5rem 1.5rem;
        border-radius: var(--radius-lg);
      }

      .confirmation-title {
        font-size: 2rem;
      }

      .confirmation-icon {
        width: 90px;
        height: 90px;
        font-size: 2.4rem;
        border-radius: 28px;
      }

      .confirmation-message {
        font-size: 0.95rem;
      }

      .order-details {
        padding: 1.4rem 1.3rem;
      }

      .order-details h5 {
        font-size: 1.1rem;
      }

      .order-details p {
        font-size: 0.88rem;
      }

      .btn-continue,
      .btn-orders {
        width: 100%;
        padding: 0.9rem 1.5rem;
        font-size: 0.92rem;
      }

      body::before,
      body::after {
        filter: blur(60px);
        opacity: 0.35;
      }
    }

    @media (max-width: 400px) {
      .confirmation-title {
        font-size: 1.7rem;
      }

      .confirmation-icon {
        width: 80px;
        height: 80px;
        font-size: 2rem;
        border-radius: 24px;
      }
    }

    /* ========== REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== ACCESSIBILITY ========== */
    .btn-continue:focus-visible,
    .btn-orders:focus-visible {
      outline: 3px solid var(--violet-vibrant);
      outline-offset: 3px;
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--lavender-mist); }
    ::-webkit-scrollbar-thumb {
      background: var(--lilac);
      border-radius: 10px;
      border: 2px solid var(--lavender-mist);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet-vibrant); }
  </style>
</head>
<body>

<!-- ================= CONFIRMATION CONTAINER ================= -->
<div class="confirmation-container">

  <!-- Decorative Circles -->
  <div class="floating-decoration decoration-1"></div>
  <div class="floating-decoration decoration-2"></div>
  <div class="floating-decoration decoration-3"></div>

  <!-- Success Icon -->
  <div class="confirmation-icon-wrapper">
    <div class="confirmation-icon">
      <i class="fas fa-check-circle"></i>
    </div>
  </div>

  <!-- Title -->
  <h1 class="confirmation-title">
    Order <span>Confirmed!</span>
  </h1>

  <!-- Dynamic Message -->
  <p class="confirmation-message" th:text="${message}">
    Thank you for your purchase! Your order has been successfully placed.
  </p>

  <!-- Order Details -->
  <div class="order-details">
    <h5>
      <i class="fas fa-receipt"></i>
      Order Summary
    </h5>

    <p>
      <i class="fas fa-check-circle success-icon"></i>
      Your payment has been processed successfully.
    </p>

    <p>
      <i class="fas fa-shipping-fast info-icon"></i>
      Expected delivery: 3–5 business days.
    </p>

    <p>
      <i class="fas fa-envelope info-icon"></i>
      Your order confirmation has been sent to your email.
    </p>
  </div>

  <!-- Buttons -->
  <div class="button-group">
    <a th:href="@{/shop}" class="btn-continue">
      <i class="fas fa-shopping-bag"></i>
      Continue Shopping
    </a>

    <a th:href="@{/order-history}" class="btn-orders">
      <i class="fas fa-clock-rotate-left"></i>
      View Orders
    </a>
  </div>

</div>

<!-- ================= CONFETTI SCRIPT ================= -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const container = document.querySelector(".confirmation-container");

    const colors = [
      "#9c6eff",
      "#ff7b6b",
      "#6bd6c0",
      "#ffd966",
      "#b39ddb",
      "#ffb4a2"
    ];

    for (let i = 0; i < 55; i++) {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.left = Math.random() * 100 + "%";
      confetti.style.top = "-20px";
      confetti.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      confetti.style.width = (Math.random() * 8 + 6) + "px";
      confetti.style.height = (Math.random() * 10 + 8) + "px";

      const duration = Math.random() * 3 + 2.5;
      const delay = Math.random() * 3;

      confetti.style.animation = "fall " + duration + "s linear " + delay + "s forwards";

      container.appendChild(confetti);
    }
  });
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Font Awesome JS (optional) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
