<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment | LuxeBoutique</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: light + modern -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    /* ========== LIGHT & ATTRACTIVE DESIGN TOKENS ========== */
    :root {
      --lavender-mist: #f3eefc;
      --lavender-soft: #e6dcf7;
      --lilac: #b39ddb;
      --violet-deep: #7c4dff;
      --violet-vibrant: #9c6eff;
      --peach-soft: #ffe8e0;
      --peach-warm: #ffb4a2;
      --coral: #ff7b6b;
      --mint-mist: #e3f7f2;
      --mint: #6bd6c0;
      --teal-deep: #0fa890;
      --sky-mist: #e8f4fd;
      --sky: #5aa9e6;
      --cream: #fffdfa;
      --white: #ffffff;
      --charcoal: #2d2640;
      --gray-soft: #8b8399;
      --success-green: #28a745;
      --success-soft: #d4f5e9;
      --success-deep: #0b6e4f;

      --gradient-hero: linear-gradient(135deg, #f3eefc 0%, #e8f4fd 50%, #ffe8e0 100%);
      --gradient-btn: linear-gradient(135deg, #9c6eff 0%, #ff7b6b 100%);
      --gradient-btn-hover: linear-gradient(135deg, #7c4dff 0%, #ff5c47 100%);
      --gradient-gold: linear-gradient(135deg, #ffd966 0%, #ffb347 100%);
      --gradient-success: linear-gradient(135deg, #6bd6c0 0%, #28a745 100%);
      --shadow-soft: 0 20px 50px -12px rgba(124, 77, 255, 0.15);
      --shadow-card: 0 30px 70px -20px rgba(124, 77, 255, 0.22);
      --shadow-input: 0 2px 10px rgba(124, 77, 255, 0.06);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* ========== BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--gradient-hero);
      color: var(--charcoal);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ========== DECORATIVE BACKGROUND BLOBS ========== */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
      animation: floatBlob 12s ease-in-out infinite;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      top: -180px;
      right: -120px;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      bottom: -160px;
      left: -100px;
      animation-delay: -6s;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }

    /* ========== PAYMENT CONTAINER ========== */
    .payment-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 560px;
      padding: 3rem 2.8rem;
      border-radius: var(--radius-xl);
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-card);
      z-index: 1;
      animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.15s;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(50px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .payment-container:hover {
      box-shadow: 0 40px 90px -24px rgba(124, 77, 255, 0.28);
    }

    /* top gradient accent bar */
    .payment-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--violet-vibrant), var(--coral), var(--mint));
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      animation: gradientShift 4s ease infinite;
      background-size: 200% 200%;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* decorative floating circles */
    .floating-decoration {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.5;
    }

    .decoration-1 {
      top: -70px;
      right: -70px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      filter: blur(30px);
      animation: circleFloat 10s ease-in-out infinite;
    }

    .decoration-2 {
      bottom: -80px;
      left: -80px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      filter: blur(30px);
      animation: circleFloat 12s ease-in-out infinite reverse;
    }

    .decoration-3 {
      top: 35%;
      left: -50px;
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #6bd6c0 0%, transparent 70%);
      filter: blur(25px);
      animation: circleFloat 14s ease-in-out infinite;
      animation-delay: -4s;
    }

    @keyframes circleFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -25px) scale(1.15); }
    }

    /* ========== CONTENT ========== */
    .payment-content {
      position: relative;
      z-index: 2;
    }

    /* ========== LOCK ICON ========== */
    .payment-icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.3rem;
      animation: badgePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.4s;
    }

    @keyframes badgePop {
      0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      70% { transform: scale(1.1) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .payment-icon {
      width: 90px;
      height: 90px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--lavender-mist), var(--peach-soft));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      color: var(--violet-deep);
      box-shadow: 0 16px 40px -12px rgba(124, 77, 255, 0.3);
      transition: var(--transition);
      position: relative;
    }

    .payment-icon::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 32px;
      border: 2px solid rgba(156, 110, 255, 0.2);
      animation: iconPulse 2.5s ease-out infinite;
    }

    @keyframes iconPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .payment-icon:hover {
      transform: translateY(-6px) rotate(-6deg) scale(1.05);
      background: var(--gradient-btn);
      color: var(--white);
      box-shadow: 0 24px 55px -14px rgba(156, 110, 255, 0.5);
    }

    .payment-icon i {
      animation: lockPulse 3s ease-in-out infinite;
    }

    @keyframes lockPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* ========== TITLE ========== */
    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 2.3rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.6rem;
      color: var(--charcoal);
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.5s;
    }

    h1 span {
      background: var(--gradient-btn);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-style: italic;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subtitle {
      color: var(--gray-soft);
      font-size: 1rem;
      margin-bottom: 2rem;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.6s;
    }

    /* ========== AMOUNT BOX ========== */
    .amount-box {
      background: linear-gradient(135deg, var(--lavender-mist) 0%, var(--peach-soft) 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 1.6rem;
      margin: 1.5rem 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px -16px rgba(124, 77, 255, 0.2);
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.7s;
    }

    .amount-box::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
      animation: circleFloat 9s ease-in-out infinite;
      pointer-events: none;
    }

    .amount-label {
      font-size: 0.8rem;
      color: var(--gray-soft);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.4rem;
      position: relative;
      z-index: 1;
    }

    .payment-amount {
      font-family: 'Fraunces', serif;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--gradient-btn);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      position: relative;
      z-index: 1;
      line-height: 1.2;
    }

    .payment-amount::before {
      content: '₹';
      font-size: 1.6rem;
      margin-right: 0.2rem;
      -webkit-text-fill-color: var(--coral);
      color: var(--coral);
    }

    /* ========== PAYMENT METHODS ========== */
    .payment-methods {
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      margin: 1.8rem 0;
      flex-wrap: wrap;
    }

    .payment-method {
      width: 88px;
      padding: 1rem 0.5rem;
      border-radius: var(--radius-lg);
      background: var(--white);
      border: 2px solid var(--lavender-soft);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: pillPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .payment-method:nth-child(1) { animation-delay: 0.8s; }
    .payment-method:nth-child(2) { animation-delay: 0.88s; }
    .payment-method:nth-child(3) { animation-delay: 0.96s; }
    .payment-method:nth-child(4) { animation-delay: 1.04s; }

    @keyframes pillPop {
      0% { opacity: 0; transform: translateY(20px) scale(0.8); }
      70% { transform: translateY(-4px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .payment-method::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-btn);
      opacity: 0;
      transition: var(--transition);
      z-index: 0;
    }

    .payment-method:hover::before {
      opacity: 1;
    }

    .payment-method:hover {
      transform: translateY(-6px) scale(1.05);
      border-color: transparent;
      box-shadow: 0 16px 36px -10px rgba(156, 110, 255, 0.5);
    }

    .payment-method i {
      display: block;
      font-size: 1.7rem;
      margin-bottom: 0.4rem;
      color: var(--violet-deep);
      position: relative;
      z-index: 1;
      transition: var(--transition);
    }

    .payment-method span {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--charcoal);
      position: relative;
      z-index: 1;
      transition: var(--transition);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .payment-method:hover i,
    .payment-method:hover span {
      color: var(--white);
    }

    .payment-method:hover i {
      transform: scale(1.15) rotate(-6deg);
    }

    /* ========== PAY BUTTON ========== */
    .btn-payment {
      width: 100%;
      max-width: 340px;
      margin: 1.8rem auto 1rem;
      padding: 1.05rem 2rem;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--gradient-gold);
      background-size: 200% 200%;
      color: #5a4600;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: var(--transition);
      box-shadow: 0 12px 30px -8px rgba(255, 179, 71, 0.5);
      animation: gradientShift 5s ease infinite;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn-payment::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transition: left 0.6s ease;
    }

    .btn-payment::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 0 0 rgba(255, 179, 71, 0.6);
      animation: pulseGold 2.5s ease-out infinite;
    }

    @keyframes pulseGold {
      0% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(255, 179, 71, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0); }
    }

    .btn-payment:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(255, 179, 71, 0.6);
      color: #3d2f00;
    }

    .btn-payment:hover::before {
      left: 100%;
    }

    .btn-payment:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-payment:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .btn-payment i {
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .btn-payment:hover i {
      transform: translateX(4px) scale(1.1);
    }

    /* ========== BACK LINK ========== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      color: var(--gray-soft);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-pill);
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 1.1s;
    }

    .back-link:hover {
      color: var(--violet-deep);
      background: var(--lavender-mist);
      transform: translateX(-4px);
    }

    .back-link i {
      transition: transform 0.3s ease;
    }

    .back-link:hover i {
      transform: translateX(-4px);
    }

    /* ========== SECURITY BADGE ========== */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.8rem;
      padding: 0.9rem 1.2rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--gray-soft);
      background: linear-gradient(135deg, var(--mint-mist), var(--success-soft));
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.9);
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 1.2s;
    }

    .security-badge i {
      color: var(--success-green);
      font-size: 1rem;
      animation: shieldPulse 2.5s ease-in-out infinite;
    }

    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(40, 167, 69, 0)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(40, 167, 69, 0.5)); }
    }

    /* ========== SPINNER ========== */
    .fa-spinner {
      animation: fa-spin 1s linear infinite;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      body {
        padding: 1.5rem 0.8rem;
      }

      .payment-container {
        padding: 2.5rem 1.5rem;
        border-radius: var(--radius-lg);
      }

      h1 {
        font-size: 1.9rem;
      }

      .subtitle {
        font-size: 0.92rem;
      }

      .payment-icon {
        width: 80px;
        height: 80px;
        font-size: 2rem;
        border-radius: 24px;
      }

      .payment-amount {
        font-size: 2.3rem;
      }

      .amount-box {
        padding: 1.3rem;
      }

      .payment-methods {
        gap: 0.5rem;
      }

      .payment-method {
        width: 78px;
        padding: 0.85rem 0.4rem;
      }

      .payment-method i {
        font-size: 1.5rem;
      }

      .payment-method span {
        font-size: 0.65rem;
      }

      .btn-payment {
        padding: 0.95rem 1.5rem;
        font-size: 0.95rem;
      }

      .security-badge {
        font-size: 0.75rem;
        padding: 0.8rem 1rem;
      }

      body::before,
      body::after {
        filter: blur(60px);
        opacity: 0.35;
      }
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 1.6rem;
      }

      .payment-amount {
        font-size: 2rem;
      }

      .payment-method {
        width: 68px;
        padding: 0.75rem 0.3rem;
      }

      .payment-method i {
        font-size: 1.3rem;
      }

      .payment-method span {
        font-size: 0.6rem;
      }
    }

    /* ========== REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== ACCESSIBILITY ========== */
    .btn-payment:focus-visible,
    .back-link:focus-visible,
    .payment-method:focus-visible {
      outline: 3px solid var(--violet-vibrant);
      outline-offset: 3px;
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--lavender-mist); }
    ::-webkit-scrollbar-thumb {
      background: var(--lilac);
      border-radius: 10px;
      border: 2px solid var(--lavender-mist);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet-vibrant); }
  </style>
</head>
<body>

<div class="payment-container">

  <!-- Decorative Circles -->
  <div class="floating-decoration decoration-1"></div>
  <div class="floating-decoration decoration-2"></div>
  <div class="floating-decoration decoration-3"></div>

  <div class="payment-content">

    <!-- Lock Icon -->
    <div class="payment-icon-wrapper">
      <div class="payment-icon">
        <i class="fas fa-lock"></i>
      </div>
    </div>

    <!-- Heading -->
    <h1>Secure <span>Payment</span></h1>

    <p class="subtitle">
      Complete your purchase safely and securely
    </p>

    <!-- Amount -->
    <div class="amount-box">
      <div class="amount-label">Amount Payable</div>
      <div class="payment-amount">
        <span th:text="${totalAmount}">0.00</span>
      </div>
    </div>

    <!-- Hidden Total -->
    <input type="hidden" id="totalAmount" th:value="${totalAmount}">

    <!-- Payment Methods -->
    <div class="payment-methods">
      <div class="payment-method">
        <i class="fab fa-cc-visa"></i>
        <span>Visa</span>
      </div>

      <div class="payment-method">
        <i class="fab fa-cc-mastercard"></i>
        <span>Master</span>
      </div>

      <div class="payment-method">
        <i class="fab fa-cc-amex"></i>
        <span>Amex</span>
      </div>

      <div class="payment-method">
        <i class="fas fa-mobile-screen-button"></i>
        <span>UPI</span>
      </div>
    </div>

    <!-- Pay Button -->
    <button type="button" id="rzp-button" class="btn-payment">
      <i class="fas fa-credit-card"></i>
      Pay Securely
    </button>

    <!-- Back -->
    <a th:href="@{/cart}" class="back-link">
      <i class="fas fa-arrow-left"></i>
      Back to Cart
    </a>

    <!-- Security Badge -->
    <div class="security-badge">
      <i class="fas fa-shield-halved"></i>
      <span>Secure payment powered by Razorpay</span>
    </div>

  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const checkoutButton = document.getElementById("rzp-button");
    const totalAmountElement = document.getElementById("totalAmount");

    if (!checkoutButton || !totalAmountElement) {
      console.error("Checkout button or total amount element not found.");
      return;
    }

    const totalAmount = parseFloat(totalAmountElement.value);

    if (isNaN(totalAmount) || totalAmount <= 0) {
      alert("Invalid total amount.");
      checkoutButton.disabled = true;
      return;
    }

    checkoutButton.addEventListener("click", function (event) {
      event.preventDefault();

      checkoutButton.disabled = true;
      checkoutButton.innerHTML =
        '<i class="fas fa-spinner me-2"></i>Creating Payment...';

      fetch(
        "/create-order?totalAmount=" + encodeURIComponent(totalAmount),
        { method: "POST" }
      )
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Unable to create Razorpay order.");
          }
          return response.json();
        })
        .then(function (order) {
          console.log("Razorpay Order:", order);

          const options = {
            key: "rzp_test_flb0L3L7lk2gsM",
            amount: order.amount,
            currency: "INR",
            name: "LuxeBoutique",
            description: "LuxeBoutique Shopping Order",
            order_id: order.id,

            handler: function (response) {
              console.log("Payment successful:", response);
              window.location.href = "/order-success";
            },

            modal: {
              ondismiss: function () {
                checkoutButton.disabled = false;
                checkoutButton.innerHTML =
                  '<i class="fas fa-credit-card"></i>Pay Securely';
              }
            },

            theme: {
              color: "#7c4dff"
            }
          };

          const razorpay = new Razorpay(options);

          razorpay.on("payment.failed", function (response) {
            console.error("Payment failed:", response.error);
            alert("Payment failed. Please try again.");
            checkoutButton.disabled = false;
            checkoutButton.innerHTML =
              '<i class="fas fa-credit-card"></i>Pay Securely';
          });

          razorpay.open();
        })
        .catch(function (error) {
          console.error("Payment Error:", error);
          alert("Unable to start payment. Please try again.");
          checkoutButton.disabled = false;
          checkoutButton.innerHTML =
            '<i class="fas fa-credit-card"></i>Pay Securely';
        });
    });
  });
</script>
