<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal | LuxeBoutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-mauve: #9a7aa0;
            --soft-mauve: #d8bfd8;
            --gold-accent: #d4af37;
            --deep-plum: #614051;
            --light-cream: #fffaf5;
            --admin-dark: #2c3e50;
        }
        
        body {
            background: linear-gradient(135deg, var(--admin-dark), #34495e);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: white;
        }
        
        .login-container {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--gold-accent), var(--primary-mauve));
        }
        
        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-accent);
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }
        
        h2::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 3px;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, white, transparent);
        }
        
        .form-label {
            color: white;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
            color: white;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--gold-accent), #e8c547);
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: 600;
            color: var(--admin-dark);
            letter-spacing: 0.5px;
            transition: all 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        
        .btn-login:hover {
            background: linear-gradient(135deg, #e8c547, var(--gold-accent));
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
        
        .error-message {
            color: #ff6b6b;
            font-weight: 500;
            text-align: center;
            margin-bottom: 20px;
            background-color: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
        }
        
        .input-group-text {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--gold-accent);
        }
        
        .floating-decoration {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            z-index: -1;
        }
        
        .decoration-1 {
            top: -50px;
            right: -50px;
        }
        
        .decoration-2 {
            bottom: -50px;
            left: -50px;
        }
        
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.8;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container position-relative">
            <div class="floating-decoration decoration-1"></div>
            <div class="floating-decoration decoration-2"></div>
            
            <h2><i class="fas fa-lock me-2"></i>Admin Portal</h2>
            
            <!-- Error Message -->
            <div th:if="${error}" class="error-message">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/admin/login}" method="post">
                <!-- Username Field -->
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                        <input type="text" id="username" name="username" class="form-control" 
                               placeholder="Enter admin username" required>
                    </div>
                </div>
                
                <!-- Password Field -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Enter password" required>
                    </div>
                </div>
                
                <!-- Login Button -->
                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
                
                <!-- Security Badge -->
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure Admin Access | 256-bit Encryption</span>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
