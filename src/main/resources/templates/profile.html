<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | LuxeBoutique</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: light + modern -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== LIGHT & ATTRACTIVE DESIGN TOKENS ========== */
    :root {
      --lavender-mist: #f3eefc;
      --lavender-soft: #e6dcf7;
      --lilac: #b39ddb;
      --violet-deep: #7c4dff;
      --violet-vibrant: #9c6eff;
      --peach-soft: #ffe8e0;
      --peach-warm: #ffb4a2;
      --coral: #ff7b6b;
      --mint-mist: #e3f7f2;
      --mint: #6bd6c0;
      --teal-deep: #0fa890;
      --sky-mist: #e8f4fd;
      --sky: #5aa9e6;
      --cream: #fffdfa;
      --white: #ffffff;
      --charcoal: #2d2640;
      --gray-soft: #8b8399;

      --gradient-hero: linear-gradient(135deg, #f3eefc 0%, #e8f4fd 50%, #ffe8e0 100%);
      --gradient-btn: linear-gradient(135deg, #9c6eff 0%, #ff7b6b 100%);
      --gradient-btn-hover: linear-gradient(135deg, #7c4dff 0%, #ff5c47 100%);
      --shadow-card: 0 30px 70px -20px rgba(124, 77, 255, 0.22);
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* ========== BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--gradient-hero);
      color: var(--charcoal);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* ========== DECORATIVE BACKGROUND BLOBS ========== */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
      animation: floatBlob 12s ease-in-out infinite;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      top: -180px;
      right: -120px;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      bottom: -160px;
      left: -100px;
      animation-delay: -6s;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }

    /* ========== PROFILE SECTION ========== */
    .profile-section {
      padding: 3.5rem 0 5rem;
      position: relative;
      z-index: 1;
    }

    /* ========== PROFILE CARD ========== */
    .profile-card {
      max-width: 680px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-xl);
      padding: 3rem 2.8rem;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
      transition: var(--transition);
      text-align: center;
      animation: cardEntrance 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.15s;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(50px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .profile-card:hover {
      box-shadow: 0 40px 90px -24px rgba(124, 77, 255, 0.28);
    }

    /* decorative floating circles */
    .profile-card::before,
    .profile-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.5;
    }

    .profile-card::before {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #b39ddb 0%, transparent 70%);
      top: -100px;
      right: -100px;
      filter: blur(40px);
      animation: circleFloat 10s ease-in-out infinite;
    }

    .profile-card::after {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #ffb4a2 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
      filter: blur(40px);
      animation: circleFloat 12s ease-in-out infinite reverse;
    }

    @keyframes circleFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -25px) scale(1.15); }
    }

    /* ========== PROFILE IMAGE ========== */
    .profile-image-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
      animation: badgePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      animation-delay: 0.4s;
    }

    @keyframes badgePop {
      0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      70% { transform: scale(1.1) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .profile-image-container {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .profile-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--white);
      box-shadow: 0 20px 50px -14px rgba(124, 77, 255, 0.35);
      transition: var(--transition);
      background: linear-gradient(135deg, var(--lavender-mist), var(--peach-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--violet-deep);
    }

    .profile-image::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(156, 110, 255, 0.25);
      animation: iconPulse 2.5s ease-out infinite;
      pointer-events: none;
    }

    @keyframes iconPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .profile-image-container:hover .profile-image {
      transform: scale(1.06) rotate(-4deg);
      box-shadow: 0 28px 60px -16px rgba(156, 110, 255, 0.5);
      border-color: var(--violet-vibrant);
    }

    .profile-image img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* ========== TITLE ========== */
    .profile-title {
      font-family: 'Fraunces', serif;
      color: var(--charcoal);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.5s;
    }

    .profile-title span {
      background: var(--gradient-btn);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-style: italic;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      color: var(--gray-soft);
      font-size: 1rem;
      margin-bottom: 2.2rem;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.6s;
    }

    /* ========== PROFILE INFO ========== */
    .profile-info {
      text-align: left;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .info-box {
      background: linear-gradient(135deg, var(--lavender-mist) 0%, var(--peach-soft) 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 1.3rem 1.5rem;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 32px -14px rgba(124, 77, 255, 0.2);
      transition: var(--transition);
      animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .info-box:nth-child(1) { animation-delay: 0.7s; }
    .info-box:nth-child(2) { animation-delay: 0.78s; }
    .info-box:nth-child(3) { animation-delay: 0.86s; }
    .info-box:nth-child(4) { animation-delay: 0.94s; }

    .info-box::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
      animation: circleFloat 9s ease-in-out infinite;
      pointer-events: none;
    }

    .info-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 45px -16px rgba(124, 77, 255, 0.3);
    }

    .info-box label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--violet-deep);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .info-box label i {
      font-size: 0.85rem;
    }

    .info-box span {
      color: var(--charcoal);
      font-size: 1.05rem;
      font-weight: 600;
      position: relative;
      z-index: 1;
      display: block;
      transition: var(--transition);
      word-break: break-word;
    }

    .info-box:hover span {
      color: var(--violet-deep);
    }

    .password-value {
      letter-spacing: 4px;
      font-size: 1.1rem !important;
      color: var(--gray-soft) !important;
    }

    .password-note {
      color: var(--gray-soft);
      font-size: 0.78rem;
      margin-top: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      z-index: 1;
    }

    .password-note i {
      color: var(--violet-deep);
      font-size: 0.75rem;
    }

    /* ========== BUTTONS ========== */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 1s;
    }

    .btn-edit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--gradient-btn);
      background-size: 200% 200%;
      color: var(--white);
      padding: 1rem 2rem;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: 0.3px;
      transition: var(--transition);
      box-shadow: 0 12px 30px -8px rgba(156, 110, 255, 0.5);
      animation: gradientShift 5s ease infinite;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn-edit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: left 0.6s ease;
    }

    .btn-edit::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 0 0 rgba(156, 110, 255, 0.7);
      animation: pulseRing 2.5s ease-out infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(156, 110, 255, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(156, 110, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(156, 110, 255, 0); }
    }

    .btn-edit:hover {
      background: var(--gradient-btn-hover);
      color: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(156, 110, 255, 0.6);
    }

    .btn-edit:hover::before {
      left: 100%;
    }

    .btn-edit i {
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .btn-edit:hover i {
      transform: rotate(-12deg) scale(1.1);
    }

    .btn-shop {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--white);
      color: var(--charcoal);
      border: 2px solid var(--lavender-soft);
      padding: 0.95rem 2rem;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.96rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn-shop::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(156, 110, 255, 0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }

    .btn-shop:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-shop:hover {
      border-color: var(--violet-vibrant);
      color: var(--violet-deep);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -10px rgba(156, 110, 255, 0.3);
    }

    .btn-shop i {
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .btn-shop:hover i {
      transform: translateX(4px) scale(1.1);
    }

    /* ========== FOOTER ========== */
    footer {
      background: var(--charcoal);
      color: rgba(255, 255, 255, 0.85);
      padding: 2.5rem 0;
      text-align: center;
      position: relative;
      z-index: 1;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
    }

    footer h4 {
      font-family: 'Fraunces', serif;
      color: var(--white);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    footer .tagline {
      color: var(--lilac);
      font-style: italic;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    footer p {
      margin-bottom: 1rem;
    }

    footer i.heart {
      color: var(--coral);
      animation: heartBeat 1.5s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.15); }
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
    }

    .social-icons a {
      color: var(--charcoal);
      background: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: var(--transition);
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    .social-icons a:hover {
      background: var(--gradient-btn);
      color: var(--white);
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 12px 24px -8px rgba(156, 110, 255, 0.5);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 991px) {
      .profile-section {
        padding: 2.5rem 0 4rem;
      }

      .profile-card {
        padding: 2.5rem 2.2rem;
      }

      .profile-title {
        font-size: 2.1rem;
      }
    }

    @media (max-width: 768px) {
      .profile-section {
        padding: 2rem 0.8rem 3rem;
      }

      .profile-card {
        padding: 2rem 1.5rem;
        border-radius: var(--radius-lg);
      }

      .profile-title {
        font-size: 1.8rem;
      }

      .subtitle {
        font-size: 0.92rem;
      }

      .profile-image-container {
        width: 110px;
        height: 110px;
      }

      .info-box {
        padding: 1.1rem 1.2rem;
      }

      .info-box span {
        font-size: 0.95rem;
      }

      .btn-edit,
      .btn-shop {
        width: 100%;
        padding: 0.9rem 1.5rem;
        font-size: 0.92rem;
      }

      body::before,
      body::after {
        filter: blur(60px);
        opacity: 0.35;
      }
    }

    @media (max-width: 400px) {
      .profile-title {
        font-size: 1.6rem;
      }

      .profile-image-container {
        width: 100px;
        height: 100px;
      }
    }

    /* ========== REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== ACCESSIBILITY ========== */
    .btn-edit:focus-visible,
    .btn-shop:focus-visible,
    .social-icons a:focus-visible {
      outline: 3px solid var(--violet-vibrant);
      outline-offset: 3px;
    }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--lavender-mist); }
    ::-webkit-scrollbar-thumb {
      background: var(--lilac);
      border-radius: 10px;
      border: 2px solid var(--lavender-mist);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--violet-vibrant); }
  </style>
</head>
<body>

<!-- ================= PROFILE SECTION ================= -->
<section class="profile-section">
  <div class="container">
    <div class="profile-card">

      <!-- Profile Image -->
      <div class="profile-image-wrapper">
        <div class="profile-image-container">
          <!-- If user has a profile image, show it. Otherwise show default icon -->
          <div class="profile-image">
            <img th:if="${user.profileImage != null}"
                 th:src="@{${user.profileImage}}"
                 alt="Profile Picture">
            <i th:if="${user.profileImage == null}" class="fas fa-user"></i>
          </div>
        </div>
      </div>

      <!-- Title -->
      <h1 class="profile-title">
        My <span>Profile</span>
      </h1>

      <p class="subtitle">
        Welcome to your LuxeBoutique account
      </p>

      <!-- Profile Info -->
      <div class="profile-info">

        <!-- Username -->
        <div class="info-box">
          <label>
            <i class="fas fa-user"></i>
            Username
          </label>
          <span th:text="${user.username}">Username</span>
        </div>

        <!-- Email -->
        <div class="info-box">
          <label>
            <i class="fas fa-envelope"></i>
            Email Address
          </label>
          <span th:text="${user.email}">user@example.com</span>
        </div>

        <!-- Phone Number -->
        <div class="info-box">
          <label>
            <i class="fas fa-phone"></i>
            Phone Number
          </label>
          <span th:text="${user.phone != null ? user.phone : 'Not provided'}">+91 98765 43210</span>
        </div>

        <!-- Password -->
        <div class="info-box">
          <label>
            <i class="fas fa-lock"></i>
            Password
          </label>
          <span class="password-value">••••••••</span>
          <p class="password-note">
            <i class="fas fa-shield-halved"></i>
            Your password is hidden for security.
          </p>
        </div>

      </div>

      <!-- Buttons -->
      <div class="button-group">
        <a th:href="@{/edit-profile}" class="btn-edit">
          <i class="fas fa-pen"></i>
          Edit Profile
        </a>

        <a th:href="@{/shop}" class="btn-shop">
          <i class="fas fa-bag-shopping"></i>
          Continue Shopping
        </a>
      </div>

    </div>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer>
  <div class="container">
    <h4>LuxeBoutique</h4>
    <p class="tagline">Elegance. Style. Confidence.</p>
    <p>
      © 2026 LuxeBoutique. All Rights Reserved. Made with
      <i class="fas fa-heart heart ms-1"></i>
    </p>

    <div class="social-icons">
      <a href="#" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="#" aria-label="Pinterest">
        <i class="fab fa-pinterest"></i>
      </a>
      <a href="#" aria-label="Twitter">
        <i class="fab fa-twitter"></i>
      </a>
      <a href="#" aria-label="Facebook">
        <i class="fab fa-facebook"></i>
      </a>
    </div>
  </div>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Font Awesome JS (optional) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
