<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Product Details</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
}

.container{
width:80%;
margin:auto;
background:white;
padding:30px;
margin-top:40px;
border-radius:10px;
}

.product-box{
display:flex;
gap:40px;
}

.product-image img{
width:350px;
border-radius:10px;
}

.product-info h2{
margin-bottom:15px;
}

.price{
color:green;
font-size:22px;
margin-bottom:20px;
}

button{
padding:10px 20px;
background:#000;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<!-- Navbar -->
<div th:replace="~{navbar}"></div>

<div class="container">

<div class="product-box">

<div class="product-image">
<img th:src="${product.imageUrl}" alt="product">
</div>

<div class="product-info">

<h2 th:text="${product.name}"></h2>

<p class="price">₹ <span th:text="${product.price}"></span></p>

<form action="/add-to-cart" method="post">

<input type="hidden" name="productId" th:value="${product.id}">

<button type="submit">Add To Cart</button>

</form>

</div>

</div>

</div>

</body>
</html>
